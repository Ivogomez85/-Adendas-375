<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Adendas 375</title>
<meta name="theme-color" content="#0E1621"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Adendas 375"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
/* ═══════════════ C · ESTUDIO — sistema de diseño ═══════════════
   Blanco puro + teal de marca + grafito. DM Sans para texto,
   IBM Plex Mono para dato duro (SAP, legajo, INLEG, cápita).
   Los 3 colores de estado son semánticos y no se tocan.        */
:root{
  --bg:#FFFFFF; --surf:#F7F8F9; --surf2:#F1F3F4;
  --line:#E3E6E8; --line2:#D3D8DB;
  --tx:#111827; --tx2:#5B6570; --tx3:#8A929B;
  --brand:#0F766E; --brand-d:#0B5952; --brand-l:#E6F4F1; --brand-l2:#CFE8E3;
  --ok:#16A34A; --ok-bg:#E9F7EE; --ok-line:#BFE6CD;
  --proc:#D97706; --proc-bg:#FDF3E3; --proc-line:#F3DFB6;
  --rej:#DC2626; --rej-bg:#FCECEC; --rej-line:#F3C9C9;
  --r:10px; --r2:14px;
  --sh:0 1px 2px rgba(17,24,39,.04);
  --sh2:0 8px 28px rgba(17,24,39,.10);
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{-webkit-overflow-scrolling:touch;}
body{
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--surf); color:var(--tx);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-ligatures:none;}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:200;background:var(--surf);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .45s var(--ease),visibility .45s;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.spl-mark{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:500;}
.spl-ring{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.spl-msg{font-size:13px;color:var(--tx2);max-width:280px;text-align:center;}
#splashRetry{display:none;padding:10px 20px;border:1px solid var(--line2);background:var(--bg);
  border-radius:var(--r);font-weight:500;font-size:13.5px;}

/* ── HEADER: marca + buscador + chips, todo en un bloque pegado arriba.
      Es el patrón de Google Maps / YouTube: el filtro vive con la búsqueda. ── */
#hdr{position:sticky;top:0;z-index:70;background:#0E1621;padding-top:0;}
#hdr .wrap{padding-bottom:10px;}
.hd{display:flex;align-items:center;gap:9px;height:50px;}
.hd-mark{font-weight:500;font-size:15.5px;letter-spacing:-.02em;color:#fff;}
.hd-dot{width:9px;height:9px;border-radius:50%;background:#3FD6A8;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(63,214,168,.16);}
.hd-sp{flex:1;}
.hd-ico{width:32px;height:32px;border-radius:var(--r);border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#A9B4C0;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;transition:.15s;}
.hd-ico:hover{background:rgba(255,255,255,.14);color:#fff;}
.hd-ico.spin i{animation:spin .8s linear infinite;}
.hd-ico.key-on{color:#3FD6A8;border-color:rgba(63,214,168,.4);background:rgba(63,214,168,.13);}

.sbox{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.07);border-radius:26px;padding:0 8px 0 16px;height:48px;
  transition:background .18s,border-color .18s,box-shadow .18s;}
.sbox:focus-within{background:#fff;border-color:#3FD6A8;box-shadow:0 0 0 3px rgba(63,214,168,.2);}
.sbox .fa-magnifying-glass{color:#8A96A4;font-size:14px;flex:0 0 auto;transition:color .18s;}
.sbox:focus-within .fa-magnifying-glass{color:var(--tx3);}
#q{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;padding:0;color:#fff;}
#q::placeholder{color:#7C8896;}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none;}
.sbox:focus-within #q{color:var(--tx);}
.s-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#8A96A4;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;transition:.15s;}
.s-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.sbox:focus-within .s-btn{color:var(--tx3);}
.sbox:focus-within .s-btn:hover{background:var(--surf2);color:var(--tx);}
#clrBtn{display:none;}
#clrBtn.show{display:flex;}
#micBtn.rec{background:var(--rej);color:#fff;animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.42);}50%{box-shadow:0 0 0 9px rgba(220,38,38,0);}}

/* fila de chips: una sola línea que se desliza, como los filtros de YouTube */
.chiprow{display:flex;gap:7px;overflow-x:auto;margin-top:11px;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);border-radius:20px;padding:6px 13px;font-size:12.5px;
  font-weight:500;color:#C2CBD5;white-space:nowrap;flex:0 0 auto;transition:.15s;}
.chip:hover{background:rgba(255,255,255,.12);color:#fff;}
.chip b{font-weight:400;color:#7C8896;font-size:11.5px;}
.chip.on{background:#fff;border-color:#fff;color:#0E1621;}
.chip.on b{color:#5B6570;}
.chip.on.ok{background:#3FD6A8;border-color:#3FD6A8;color:#06331F;}
.chip.on.ok b{color:#06331F;opacity:.6;}
.chip.on.proc{background:#F2B33D;border-color:#F2B33D;color:#3D2705;}
.chip.on.proc b{color:#3D2705;opacity:.6;}
.chip.on.rej{background:#F2705F;border-color:#F2705F;color:#3D0E08;}
.chip.on.rej b{color:#3D0E08;opacity:.6;}
.chip-clr{border-style:dashed;color:#8A96A4;}
.chip-sep{width:1px;background:rgba(255,255,255,.14);flex:0 0 auto;margin:4px 3px;}

.nl-chips{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;}
.nl-lbl{font-size:10.5px;color:#7C8896;letter-spacing:.09em;text-transform:uppercase;font-weight:500;}
.nl-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(63,214,168,.15);
  color:#7FE7C4;border:1px solid rgba(63,214,168,.3);border-radius:20px;padding:3px 10px;
  font-size:12px;font-weight:500;}
.nl-chip b{cursor:pointer;opacity:.6;font-weight:400;}
.nl-chip b:hover{opacity:1;}

/* ── BARRA DE RESULTADOS: la estadística viva, siempre a la vista y siempre
      recalculada con los filtros puestos. Estilo Google Flights. ── */
.resbar{display:flex;align-items:stretch;gap:8px;margin:16px 0 0;flex-wrap:wrap;}
.rb{flex:1 1 0;min-width:96px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
  padding:10px 12px;text-align:left;box-shadow:var(--sh);transition:.15s;position:relative;overflow:hidden;}
.rb:hover{border-color:var(--line2);}
.rb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2);}
.rb.ok::before{background:var(--ok);} .rb.proc::before{background:var(--proc);} .rb.rej::before{background:var(--rej);}
.rb-n{font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.05;
  font-family:"IBM Plex Mono",monospace;}
.rb-l{font-size:11px;color:var(--tx3);margin-top:2px;letter-spacing:.03em;}
.rb.on{background:#0E1621;border-color:#0E1621;}
.rb.on .rb-n{color:#fff;} .rb.on .rb-l{color:#A9B4C0;}
.rb-tot{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:10px 14px;border-radius:12px;background:var(--surf2);min-width:92px;border:1px solid transparent;
  transition:.15s;}
.rb-tot:hover{border-color:var(--line2);background:var(--bg);}
.rb-tot b{font-size:18px;font-weight:500;font-family:"IBM Plex Mono",monospace;line-height:1.1;}
.rb-tot span{font-size:10.5px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;}
.rb-tot.on{background:#0E1621;border-color:#0E1621;}
.rb-tot.on b{color:#fff;} .rb-tot.on span{color:#A9B4C0;}
.tb-inf{width:100%;justify-content:center;background:var(--brand-l);border-color:var(--brand-l2);
  color:var(--brand-d);}
.tb-inf:hover{background:var(--brand);border-color:var(--brand);color:#fff;}

/* ── DOS COLUMNAS: en celular se apila y el mapa se pliega; en pantalla
      grande el mapa queda fijo al lado de la lista, no debajo. ── */
.cols{display:grid;grid-template-columns:1fr;gap:16px;padding:16px 0 0;}
.col-side{display:flex;flex-direction:column;gap:10px;min-width:0;}
.col-main{min-width:0;}
@media(min-width:980px){
  .wrap{max-width:1180px;}
  .cols{grid-template-columns:340px minmax(0,1fr);gap:26px;align-items:start;}
  .col-side{position:sticky;top:184px;}
}
.panel{border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);
  box-shadow:var(--sh);overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:12px 14px;text-align:left;color:var(--tx);}
.panel-h > i:first-child{color:var(--brand);font-size:13px;}
.ph-t{font-size:12.5px;font-weight:500;}
.ph-n{margin-left:auto;font-size:11px;color:var(--tx3);}
.ph-x{font-size:11px;color:var(--tx3);transition:transform .25s var(--ease);margin-left:8px;}
.panel-h .ph-n + .ph-x{margin-left:8px;}
.panel-h > .ph-x:nth-child(4){margin-left:auto;}
.panel.cerrado .ph-x{transform:rotate(-90deg);}
.panel.cerrado .panel-b{display:none;}
.panel-b{padding:0 12px 12px;}
.lista-h{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px;}
.lista-h .sec-n{margin-left:auto;}
.sec-t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);font-weight:500;}
.sec-n{font-size:11px;color:var(--tx3);}
.more-btn{width:100%;padding:11px;border:0;background:var(--surf);color:var(--brand);
  font-size:12.5px;font-weight:500;}

/* ── PANORAMA DETALLADO (panel plegable) ── */
.blk-sub{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
  font-weight:500;margin:2px 0 9px;}
.etapas{display:flex;flex-direction:column;gap:8px;}
.et{display:flex;align-items:center;gap:9px;font-size:12px;}
.et .nm{flex:0 0 92px;color:var(--tx2);}
.et .tr{flex:1;height:6px;border-radius:3px;background:var(--surf2);overflow:hidden;}
.et .tr i{display:block;height:100%;border-radius:3px;background:var(--ok);
  transition:width .45s var(--ease);}
.et .v{font-size:12px;font-weight:500;font-family:"IBM Plex Mono",monospace;min-width:26px;text-align:right;}
.gb{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:5px 0;
  text-align:left;transition:opacity .15s;}
.gb:hover{opacity:.7;}
.gb .nm{font-size:12px;color:var(--tx2);flex:0 0 92px;}
.gb.on .nm{color:var(--tx);font-weight:500;}
.gb .tr{flex:1;height:6px;border-radius:3px;background:var(--surf2);overflow:hidden;}
.gb .tr i{display:block;height:100%;border-radius:3px;transition:width .45s var(--ease);}
.gb .v{font-size:12px;font-weight:500;font-family:"IBM Plex Mono",monospace;min-width:26px;text-align:right;}

/* ── LISTA DE PRESTADORES ── *//* ── LISTA DE PRESTADORES ── */
.plist{display:flex;flex-direction:column;gap:8px;}
.pcard{border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);padding:13px 14px;box-shadow:var(--sh);
  text-align:left;width:100%;display:block;transition:border-color .15s,transform .12s,box-shadow .15s;
  animation:fadeUp .34s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
.pcard:hover{border-color:var(--line2);box-shadow:var(--sh);}
.pcard:active{transform:scale(.994);}
.pc-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px;}
.pc-nm{font-size:14.5px;font-weight:500;line-height:1.32;flex:1;min-width:0;letter-spacing:-.01em;}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11px;
  font-weight:500;white-space:nowrap;flex:0 0 auto;}
.st i{width:6px;height:6px;border-radius:50%;display:block;}
.st.ok{background:var(--ok-bg);color:#15803D;} .st.ok i{background:var(--ok);}
.st.proc{background:var(--proc-bg);color:#9A5608;} .st.proc i{background:var(--proc);}
.st.rej{background:var(--rej-bg);color:#B01B1B;} .st.rej i{background:var(--rej);}
.pc-meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12px;color:var(--tx2);}
.pc-meta span{display:inline-flex;align-items:center;gap:5px;}
.pc-meta .k{color:var(--tx3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;}
.pc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.tag{font-size:10.5px;font-weight:500;border-radius:5px;padding:2.5px 7px;background:var(--surf2);color:var(--tx2);}
.tag.cap{background:var(--brand-l);color:var(--brand-d);}
.empty{border:1px dashed var(--line2);border-radius:var(--r2);padding:34px 20px;text-align:center;color:var(--tx2);font-size:13.5px;}

/* ── MODAL ── */
.ov{position:fixed;inset:0;z-index:120;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility .28s;
  display:flex;align-items:flex-end;justify-content:center;}
.ov.open{opacity:1;visibility:visible;}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;transform:translateY(26px) scale(.99);opacity:0;
  transition:transform .34s var(--ease),opacity .28s var(--ease);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.ov.open .sheet{transform:none;opacity:1;}
@media(min-width:640px){
  .ov{align-items:center;padding:24px;}
  .sheet{border-radius:var(--r2);max-height:88vh;}
}
.sh-hd{position:sticky;top:0;background:#0E1621;border-bottom:0;
  padding:16px 18px 15px;z-index:2;}
.sh-hd .sh-nm{color:#fff;}
.sh-hd .sh-ids{color:#8A96A4;}
.sh-hd .sh-ids b{color:#D7DEE5;}
.sh-grab{background:rgba(255,255,255,.28);}
.sh-t{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#C2CBD5;}
.sh-t:hover{border-color:rgba(63,214,168,.5);background:rgba(63,214,168,.16);color:#7FE7C4;}
.sh-t.x{background:rgba(255,255,255,.12);border-color:transparent;}
.sh-t.x:hover{background:rgba(255,255,255,.22);color:#fff;}
.sh-grab{width:34px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px;}
@media(min-width:640px){.sh-grab{display:none;}}
.sh-tools{position:absolute;top:13px;right:13px;display:flex;gap:6px;}
.sh-t{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
  color:var(--tx2);display:flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;}
.sh-t:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l);}
.sh-t .fa-whatsapp{font-size:15px;}
.sh-t.x{background:var(--surf2);border-color:transparent;}
.sh-t.x:hover{background:var(--line);color:var(--tx);}
.sh-nm{font-size:18px;font-weight:500;line-height:1.28;letter-spacing:-.02em;padding-right:118px;}
.sh-chip{margin-top:10px;}
.sh-ids{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11.5px;color:var(--tx3);}
.sh-body{padding:0 18px;}
.blk{padding:18px 0;border-bottom:1px solid var(--line);}
.blk:last-child{border-bottom:0;}
.blk-t{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);font-weight:500;margin-bottom:12px;}
/* pares dato/valor del bloque de perfil */
.kv{display:flex;gap:10px;align-items:baseline;margin-top:9px;font-size:12.5px;}
.kv span{color:var(--tx3);flex:0 0 auto;min-width:112px;}
.kv b{font-weight:500;color:var(--tx);word-break:break-word;}
/* acciones grandes: el dato va adentro del botón */
.acts{display:flex;flex-direction:column;gap:8px;}
.big{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg);text-decoration:none;color:var(--tx);
  transition:.15s;box-shadow:var(--sh);}
.big:hover{border-color:var(--brand);background:var(--brand-l);}
.big > i{font-size:15px;color:var(--brand);width:20px;text-align:center;flex:0 0 auto;}
.big span{display:flex;flex-direction:column;gap:2px;min-width:0;}
.big b{font-size:13.5px;font-weight:500;}
.big em{font-style:normal;font-size:12px;color:var(--tx2);word-break:break-all;line-height:1.35;}
.big.off{opacity:.5;box-shadow:none;background:var(--surf);}
.big.off > i{color:var(--tx3);}
.disc.soon{text-align:left;line-height:1.55;}
.disc.soon i{color:var(--tx3);margin-right:6px;}
.disc.soon span{display:block;margin-top:4px;font-size:11.5px;}

/* ── TIMELINE: el camino a la firma (signature) ── */
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:9px;bottom:9px;width:2px;background:var(--line);border-radius:2px;}
.tl-fill{position:absolute;left:8px;top:9px;width:2px;background:var(--ok);border-radius:2px;
  transform-origin:top;animation:tlgrow .75s var(--ease) forwards;}
@keyframes tlgrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.tl-i{position:relative;padding:0 0 15px;}
.tl-i:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:18px;height:18px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:8px;color:var(--tx3);}
.tl-i.done .tl-dot{background:var(--ok);border-color:var(--ok);color:#fff;}
.tl-i.now .tl-dot{background:var(--bg);border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 4px var(--ok-bg);}
.tl-i.rej .tl-dot{background:var(--rej);border-color:var(--rej);color:#fff;}
.tl-i.proc-now .tl-dot{border-color:var(--proc);color:var(--proc);box-shadow:0 0 0 4px var(--proc-bg);}
.tl-nm{font-size:13.5px;font-weight:500;line-height:1.35;}
.tl-i:not(.done):not(.now):not(.rej):not(.proc-now) .tl-nm{color:var(--tx3);font-weight:400;}
.tl-sub{font-size:11.5px;color:var(--tx3);margin-top:2px;}
.tl-i.now .tl-sub,.tl-i.proc-now .tl-sub{color:var(--tx2);}
.tl-here{display:inline-block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;
  border-radius:4px;padding:2px 6px;margin-left:7px;vertical-align:1px;background:var(--ok-bg);color:#15803D;}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   MOTORES PORTADOS DE consulta.html — no tocar salvo que cambie el origen.

var DRIVE_URL = "https://script.google.com/macros/s/AKfycbwWckLdy2KrNqyhl1pWaduQt-NFIvOxNn4KokbqnETDSNJotArehTShq5waHw16vEZdww/exec";

function up(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim().replace(/\s+/g," ");}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function nfmt(n){return (n||0).toLocaleString("es-AR");}
var __COL_ALIAS={ "FECHA FIRMA ADENDA":["FECHA DE FIRMA ADENDA","FECHA FIRMA","FECHA DE FIRMA"] };
function G(r,name){
  if(r[name]!==undefined) return r[name];
  var target=up(name);
  for(var k in r){ if(r.hasOwnProperty(k) && up(k)===target) return r[k]; }
  var al=__COL_ALIAS[up(name)]||__COL_ALIAS[name];
  if(al){
    for(var i=0;i<al.length;i++){
      var a=up(al[i]);
      for(var k2 in r){ if(r.hasOwnProperty(k2) && up(k2)===a) return r[k2]; }
    }
  }
  return "";
}
function esFantasma(r){
  var p=up(G(r,"PRESTADOR")), sap=String(G(r,"SAP")||"").trim();
  var chip=up(G(r,"INTERVENCION UGTO -C")||G(r,"INTERVENCION UGTO - C")||"");
  return (!p||p==="-") && !sap && !!chip && chip!=="-";
}
function isReal(r){if(esFantasma(r))return false;var p=up(G(r,"PRESTADOR"));return !!p&&p!=="NO ENCONTRADO"&&p.indexOf("SUMA")<0;}

/* ── Parser del espejo (idéntico al de consulta.html, incluido el fix multilínea) ── */
  function parseCSV(text){
    // Split en líneas RESPETANDO comillas: un salto de línea dentro de una celda
    // entrecomillada NO corta la línea lógica. Esto evita que las observaciones
    // multilínea (o la nueva columna VIABILIZADOR) corran los bloques/KPIs.
    var lines = (function(t){
      var out=[], cur='', inQ=false;
      for(var p=0;p<t.length;p++){
        var ch=t[p];
        if(ch==='"'){ inQ=!inQ; cur+=ch; }
        else if((ch==='\n'||ch==='\r') && !inQ){
          if(ch==='\r' && t[p+1]==='\n') p++; // CRLF
          out.push(cur); cur='';
        } else { cur+=ch; }
      }
      if(cur.length) out.push(cur);
      return out;
    })(text);
    // Limpiar comillas de envoltura de cada celda al hacer split posterior:
    // se define un helper splitCells que respeta comillas dentro de una línea lógica.
    function splitCells(line){
      var cells=[], field='', inQ=false;
      for(var p=0;p<line.length;p++){
        var ch=line[p], nx=line[p+1];
        if(inQ){
          if(ch==='"'){ if(nx==='"'){ field+='"'; p++; } else { inQ=false; } }
          else field+=ch;
        } else {
          if(ch==='"') inQ=true;
          else if(ch===';'){ cells.push(field); field=''; }
          else field+=ch;
        }
      }
      cells.push(field);
      return cells;
    }
    var out = {}, i = 0;
    function skipEmpty(){ while(i<lines.length && (!lines[i].trim()||lines[i].toUpperCase().startsWith('HOJA'))) i++; }
    function readBlock(){
      skipEmpty(); if(i>=lines.length) return null;
      var headers = splitCells(lines[i]).map(function(h){return h.trim();}); i++;
      var rows = [];
      while(i<lines.length && lines[i].trim() && !lines[i].toUpperCase().startsWith('HOJA')){
        var cols = splitCells(lines[i]).map(function(c){return c.trim();});
        var row = {}; headers.forEach(function(h,idx){row[h]=cols[idx]||'';});
        rows.push(row); i++;
      }
      return {headers:headers, rows:rows};
    }
    out.mesa        = readBlock();
    out.ultimoEstado= readBlock();
    out.mensaje     = readBlock();
    out.crossSem    = readBlock();
    out.ugl         = readBlock();
    out.intervA     = readBlock();
    out.migrado     = readBlock();
    out.evalPopp    = readBlock();
    out.intervB     = readBlock();
    out.contractual = readBlock();
    out.intervC     = readBlock();  // INTERVENCION UGTO -C (viene después de contractual)
    out.grupoNota   = readBlock();
    out.resultado375= readBlock();
    out.grupoOk     = readBlock();   // bloque GRUPO OK aggregate — mantiene alineación
    out.modulosSnota= readBlock();
    // PRESTADORES — línea con "PRESTADOR;UGL"
    while(i<lines.length && !lines[i].includes('PRESTADOR;UGL')) i++;
    if(i<lines.length){
      var ph=splitCells(lines[i]).map(function(h){return h.trim();}); i++;
      var prows=[];
      while(i<lines.length && lines[i].trim() && !lines[i].toUpperCase().startsWith('HOJA') && lines[i].replace(/;/g,'').trim()){
        var ps=splitCells(lines[i]).map(function(c){return c.trim();});
        if(!ps[0]||ps[0].toLowerCase().includes('suma')){i++;continue;}
        // Skip rows without a valid SAP (numeric) — filters noise rows
        var sapVal=ps[2]||''; if(!sapVal||isNaN(parseInt(sapVal,10))){i++;continue;}
        var pr={}; ph.forEach(function(h,idx){pr[h]=ps[idx]||'';});
        // EXPEDIENTE is col index 3 in the updated CSV
        if(!pr['EXPEDIENTE']&&ps.length>3) pr['EXPEDIENTE']=ps[3]||'';
        prows.push(pr); i++;
      }
      out.prestadores={headers:ph,rows:prows};
    }
    // GRUPO OK PIVOT (UGL×Grupos) — al final del CSV, buscar hacia atrás
    (function(){
      var j=lines.length-1;
      while(j>=0 && !lines[j].startsWith('UGL;Especialidades')) j--;
      if(j<0){out.grupoOkPivot=null;return;}
      var h=splitCells(lines[j]).map(function(c){return c.trim();}); j++;
      var rr=[];
      // estados/headers que delimitan otros bloques y NO deben entrar al pivot
      var STOP={'VIGENTE':1,'NO':1,'SI':1,'SÍ':1};
      while(j<lines.length && lines[j].trim() && !lines[j].toUpperCase().startsWith('HOJA')){
        var cc=splitCells(lines[j]).map(function(c){return c.trim();});
        var first=(cc[0]||'').trim();
        var firstU=first.toUpperCase();
        // corta el bloque al toparse con filas de otros bloques (VIGENTE/NO/SI), totales, o primer campo numérico/vacío
        if(!first || STOP[firstU] || firstU.indexOf('SUMA')>=0 || /^\d+$/.test(first)){
          if(firstU.indexOf('SUMA')>=0){ j++; continue; } // suma del propio pivot: saltar
          break; // VIGENTE / NO / SI / numérico suelto / vacío → fin del pivot
        }
        var row={}; h.forEach(function(k,idx){row[k]=cc[idx]||'';});
        rr.push(row); j++;
      }
      out.grupoOkPivot={headers:h,rows:rr};
    })();
    // VIGENCIA CONTRACTUAL (bloque VIGENTE) — leído por header, independiente de la posición
    (function(){
      var j=0;
      while(j<lines.length && !/^VIGENTE\s*;/i.test(lines[j].trim())) j++;
      if(j>=lines.length){out.vigencia=null;return;}
      var h=splitCells(lines[j]).map(function(c){return c.trim();}); j++;
      var rr=[];
      while(j<lines.length && lines[j].trim() && !lines[j].toUpperCase().startsWith('HOJA')){
        var cc=splitCells(lines[j]).map(function(c){return c.trim();});
        var k0=(cc[0]||'').toUpperCase();
        var row={}; h.forEach(function(k,idx){row[k]=cc[idx]||'';});
        rr.push(row);
        // el pivot VIGENTE tiene 3 filas (vacío/NO/SI) + "Suma total" → cortar tras la suma
        if(k0.indexOf('SUMA')>=0) break;
        j++;
      }
      out.vigencia={headers:h,rows:rr};
    })();
    // ── TD COMPLETA DE ADENDAS (26 columnas, arranca ~fila 673) — header inicia con "SAP;UGL;PRESTADOR;INGRESO"
    // OJO: las celdas de observaciones traen saltos de línea CRUDOS (sin comillas), por eso una fila lógica
    // puede ocupar varias líneas físicas. Reensamblamos: si una línea no arranca con SAP numérico, es
    // continuación de la última celda de la fila anterior.
    (function(){
      var j=0, hi=-1;
      for(j=0;j<lines.length;j++){
        if(/^\s*SAP\s*;\s*UGL\s*;\s*PRESTADOR\s*;\s*INGRESO/i.test(lines[j])){ hi=j; break; }
      }
      if(hi<0){ out.tdAdendas=null; return; }
      var h=lines[hi].split(';').map(function(c){return c.trim();});
      var ncol=h.length;
      var rr=[];
      // Parser CSV que respeta comillas: una celda entre comillas puede contener ';' y saltos
      // de línea sin que cuenten como separador. Esto evita que observaciones multilínea
      // (ej. COSEME con texto entrecomillado en OBSERVACIONES UGTO A) corran las columnas.
      // 1) Reensamblar el texto crudo de la TD (desde hi+1 hasta el próximo bloque HOJA)
      var rawLines=[];
      for(var k=hi+1;k<lines.length;k++){
        if(lines[k].toUpperCase().startsWith('HOJA')) break;
        rawLines.push(lines[k]);
      }
      var blob=rawLines.join('\n');
      // 2) Tokenizar respetando comillas dobles
      function parseCSVrows(text){
        var rows=[], field='', row=[], inQ=false;
        for(var p=0;p<text.length;p++){
          var ch=text[p], nx=text[p+1];
          if(inQ){
            if(ch==='"'){ if(nx==='"'){ field+='"'; p++; } else { inQ=false; } }
            else { field+=ch; }
          } else {
            if(ch==='"'){ inQ=true; }
            else if(ch===';'){ row.push(field); field=''; }
            else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
            else if(ch==='\r'){ /* ignorar */ }
            else { field+=ch; }
          }
        }
        if(field.length||row.length){ row.push(field); rows.push(row); }
        return rows;
      }
      var parsed=parseCSVrows(blob);
      // 3) Reensamblar filas lógicas: una fila válida arranca con SAP numérico.
      //    Si una fila parseada no arranca con número, es continuación de la anterior
      //    (caso raro de saltos fuera de comillas) → se pega a la última celda.
      var cur=null;
      function pushCur(){
        if(!cur) return;
        var row={};
        for(var x=0;x<ncol;x++){
          var key=h[x];
          // Saltar columnas con encabezado vacío (ej. NOTIFICACIONES sin nombre): NO crean
          // clave "" (que pisaría datos), pero SÍ ocupan su posición x, así las columnas
          // siguientes (contacto/mesa de soporte hasta LEGAJO) quedan bien alineadas.
          if(!key) continue;
          row[key]=(cur[x]!==undefined?String(cur[x]).trim():'');
        }
        rr.push(row); cur=null;
      }
      for(var i2=0;i2<parsed.length;i2++){
        var cells=parsed[i2];
        var first=(cells[0]!==undefined?String(cells[0]).trim():'');
        // Fila NUEVA: arranca con SAP numérico de 3-7 dígitos (no 8+, que es teléfono) Y
        // (la 2ª celda parece UGL con letras — texto — O trae muchas celdas). Una continuación
        // multilínea (2º renglón de un teléfono, ej. "1155790338") arranca con número pero su
        // 2ª celda no es texto tipo UGL y trae pocas celdas → NO es fila nueva, es continuación.
        var _sapPlausible = /^[0-9]{3,7}$/.test(first);
        var _c1=String(cells[1]==null?"":cells[1]);
        var _segUGL=/[A-Za-zÁÉÍÓÚÑ]/.test(_c1);
        var esFilaNueva = _sapPlausible && (_segUGL || cells.length >= Math.max(6, Math.floor(ncol*0.4)));
        if(esFilaNueva){
          pushCur();
          cur=cells.slice();
        } else if(cur){
          // continuación residual (multilínea dentro de una celda): pegar a la última celda
          if(cells.length){
            cur[cur.length-1]=(cur[cur.length-1]||'')+'\n'+cells[0];
            for(var z=1;z<cells.length;z++) cur.push(cells[z]);
          }
        }
      }
      pushCur();
      out.tdAdendas={headers:h, rows:rr};
    })();
    return out;
  }

/* Ranking de avance: cuanto mayor la etapa, más avanzado. Negativos penalizados. */
function poRankEstado(est){
  var e=up(est||"");
  if(!e) return -1;
  var neg=/RECHAZ|DEVOLVER EE|DEVOLU|NEGATIV/.test(e);
  var dic=(typeof DICCIONARIO_ESTADOS!=="undefined")?DICCIONARIO_ESTADOS:[];
  var best=null;
  for(var i=0;i<dic.length;i++){ if(up(dic[i].estado)===e){best=dic[i];break;} }
  var etapa=best?best.etapa:0;
  return neg ? (etapa-100) : etapa;
}

  for(var i=0;i<dic.length;i++){ if(up(dic[i].estado)===e) return dic[i].desc||""; }

  ],
  a3: [ /* etapa 3 · final: cápita asignada y cierre */
    "ASIGNACION DE CAPITA","ADENDA EN SII","ADENDA FINALIZADA","FINALIZADO","CIERRE","AVISO UGL"
  ]
};

/* Prefijos de rescate: si el estado no matchea exacto, se prueba por "empieza con".
   Cubre variantes de tipeo del espejo sin tener que enumerarlas todas. */
var MAP_PREFIJOS = [
  {pre:"RECHAZ", et:"rechazado"}, {pre:"DEVOLVER", et:"rechazado"}, {pre:"DEVOLUCION", et:"rechazado"},
  {pre:"EN ANALISIS", et:"p1"},   {pre:"FALTA DOC", et:"p2"},       {pre:"DERIVAR A UGL", et:"p2"},
  {pre:"EN UGL", et:"p2"},        {pre:"DERIVAR A UTM", et:"p3"},   {pre:"EN UTM", et:"p4"},
  {pre:"ADENDA EN SII", et:"a3"}, {pre:"ASIGNACION", et:"a3"},      {pre:"ADENDA FINALIZ", et:"a3"},
  {pre:"ADENDA FIRMAD", et:"a2"}, {pre:"ADENDA", et:"a1"}
];

/* ── LA FUNCIÓN ──
   Entrada: una fila del espejo. Salida:
   { gen:"ok"|"proc"|"rej", hito:1..7, sub:1..4 (proc) o 1..3 (ok),
     label:"Aprobados", etapaNm:"Firmada", estadoReal:"...", tieneInleg:bool } */
function mapearEstado(r){
  var real = String(G(r,"ULTIMO ESTADO")||"").trim();
  var e = up(real);
  var inleg = String(G(r,"INLEG ADENDA")||"").trim();
  var tieneInleg = /N?LEG-\d{4}-(\d{6,})/i.test(inleg);

  /* 1) El rechazo manda sobre todo lo demás. */
  var esRechazo = MAP_ESTADOS.rechazado.indexOf(e)>=0 || /^RECHAZ|^DEVOLVER|^DEVOLUCION|NEGATIV/.test(e);
  if(esRechazo) return __armar("rej",0,real,tieneInleg);

  /* 2) Buscar la sub-etapa por coincidencia exacta. */
  var et=null;
  ["p1","p2","p3","p4","a1","a2","a3"].forEach(function(k){
    if(!et && MAP_ESTADOS[k].indexOf(e)>=0) et=k;
  });

  /* 3) Rescate por prefijo si no hubo match exacto. */
  if(!et){
    for(var i=0;i<MAP_PREFIJOS.length;i++){
      if(e.indexOf(MAP_PREFIJOS[i].pre)===0){ et=MAP_PREFIJOS[i].et; break; }
    }
  }

  /* 4) Sin estado legible: queda en el arranque del proceso. */
  if(!et) et="p1";
  if(et==="rechazado") return __armar("rej",0,real,tieneInleg);

  var hito={p1:1,p2:2,p3:3,p4:4,a1:5,a2:6,a3:7}[et];

  /* 5) El INLEG es el disparador de la etapa 2 de Aprobados: si está cargado y el
        caso no es un rechazo, el prestador firmó — nunca puede quedar por debajo. */
  if(tieneInleg && hito<6) hito=6;

  return __armar(hito>=5?"ok":"proc", hito, real, tieneInleg);
}

function __armar(gen,hito,real,tieneInleg){
  var L={ok:"Aprobados",proc:"En proceso",rej:"Rechazados"};
  var etapaNm="";
  if(gen==="ok")   etapaNm=["Inicial","Firmada","Cápita y cierre"][hito-5]||"Inicial";
  if(gen==="proc") etapaNm=["Análisis POPP","Documentación / UGL","Derivar a UTM","En UTM"][hito-1]||"Análisis POPP";
  if(gen==="rej")  etapaNm="Rechazado";
  return {
    gen:gen, hito:hito,
    sub:(gen==="ok"?hito-4:(gen==="proc"?hito:0)),
    label:L[gen], etapaNm:etapaNm,
    estadoReal:real||"—", tieneInleg:tieneInleg
  };
}
window.mapearEstado=mapearEstado;

</script>
<script>
/* ═══════════════════════════ APP ═══════════════════════════ */
var DATA=[];        // filas crudas del espejo (reales)
var IDX=[];         // registros deduplicados SAP+UGL, uno por prestador
var VIS=[];         // registros visibles con los filtros actuales
var PAGE=30;        // cuántos se muestran de a tandas

var F={estado:"ok", ugl:"", grupo:"", capita:"", q:"", qResto:""};  // foco por defecto: Aprobados
/* Con texto en el buscador, la búsqueda es SIEMPRE sobre el universo completo:
   el segmento de estado se suspende hasta que la persona toca un chip a propósito. */
var SEG_MANUAL=false;
function buscando(){ return !!(F.q && F.q.trim()); }
function segActivo(){ return buscando() ? (SEG_MANUAL?F.estado:"") : F.estado; }

/* ── CARGA ── */
function cargarDatos(isManual){
  var sb=document.getElementById("syncBtn");
  if(isManual&&sb) sb.classList.add("spin");
  if(!isManual){
    var sp=document.getElementById("splash"); sp.classList.remove("hide");
    document.getElementById("splashRing").style.display="";
    document.getElementById("splashRetry").style.display="none";
    document.getElementById("splashMsg").textContent="Leyendo el circuito de adendas en vivo";
  }
  fetch(DRIVE_URL,{redirect:"follow"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(text){
      if(text.indexOf("ERROR:")===0) throw new Error(text);
      var d=parseCSV(text);
      DATA=(d.tdAdendas&&d.tdAdendas.rows)?d.tdAdendas.rows:[];
      DATA=DATA.filter(function(r){ return isReal(r); });
      window.__tdAdendas=DATA;
      construirIndice();
      renderTodo();
      document.getElementById("splash").classList.add("hide");
    })
    .catch(function(err){
      if(isManual){ alert("No se pudo actualizar:\n"+err.message); }
      else{
        document.getElementById("splashRing").style.display="none";
        document.getElementById("splashMsg").textContent="No se pudo cargar el circuito: "+err.message;
        document.getElementById("splashRetry").style.display="";
      }
      console.error(err);
    })
    .finally(function(){ if(sb) setTimeout(function(){ sb.classList.remove("spin"); },700); });
}

/* ── ÍNDICE: un registro por prestador (SAP+UGL). Ante varios EE del mismo
      prestador gana el que está más avanzado en el circuito (poRankEstado). ── */
function construirIndice(){
  var porClave={};
  DATA.forEach(function(r){
    var sap=String(G(r,"SAP")||"").trim();
    var ugl=String(G(r,"UGL")||"").trim();
    if(!sap) return;
    var k=up(sap)+"||"+up(ugl);
    var rank=poRankEstado(G(r,"ULTIMO ESTADO"));
    var tieneInleg=esFirmadaFinal(r);
    if(!porClave[k]){ porClave[k]={r:r,rank:rank,inleg:tieneInleg,ees:1}; }
    else{
      porClave[k].ees++;
      // gana el más avanzado; ante empate, el que trae INLEG
      var cur=porClave[k];
      if(rank>cur.rank || (rank===cur.rank && tieneInleg && !cur.inleg)){
        cur.r=r; cur.rank=rank; cur.inleg=tieneInleg;
      }
    }
  });
  IDX=Object.keys(porClave).map(function(k,i){
    var r=porClave[k].r;
    var m=mapearEstado(r);
    var p=perfilPrestador(r);
    var cap=null; try{ cap=window.__capitaDePrestador(r); }catch(e){}
    var grupos=(p.rubros&&p.rubros.length)?p.rubros:p.califica;
    var uglTxt=String(G(r,"UGL")||"").replace(/^\s*\d+\s*[.\-)]*\s*/,"").trim();
    return {
      i:i, r:r, ees:porClave[k].ees,
      sap:String(G(r,"SAP")||"").trim(),
      prest:String(G(r,"PRESTADOR")||"").trim(),
      legajo:String(G(r,"LEGAJO")||"").trim(),
      ugl:uglTxt, uglN:uglNum(uglTxt),
      tel:String(G(r,"TELEFONOS")||"").trim(),
      mail:String(G(r,"CORREO ELECTRONICO")||"").trim(),
      inleg:String(G(r,"INLEG ADENDA")||"").trim(),
      modFirm:String(G(r,"DETALLE MODULOS")||"").trim(),
      califica:(p.califica||[]).join(" + "),
      m:m, perfil:p, grupos:grupos||[], cap:cap,
      _b:up([G(r,"PRESTADOR"),G(r,"SAP"),G(r,"LEGAJO"),uglTxt,G(r,"INLEG ADENDA"),(grupos||[]).join(" ")].join(" "))
    };
  });
  // orden: aprobados primero, y dentro de cada grupo por etapa descendente y nombre
  var ord={ok:0,proc:1,rej:2};
  IDX.sort(function(a,b){
    if(ord[a.m.gen]!==ord[b.m.gen]) return ord[a.m.gen]-ord[b.m.gen];
    if(a.m.hito!==b.m.hito) return b.m.hito-a.m.hito;
    return a.prest.localeCompare(b.prest,"es");
  });
}

/* ── BÚSQUEDA ──
   Multi-palabra: cada término tiene que aparecer en algún campo del prestador
   (nombre, SAP, legajo, UGL, INLEG, grupo, último estado). El orden en que se
   escriben no importa, y busca SIEMPRE sobre el universo completo. */
function tokens(q){
  return up(q||"").split(/[\s,]+/).filter(function(t){ return t.length>0; });
}
function matchea(x,toks){
  for(var i=0;i<toks.length;i++){ if(x._b.indexOf(toks[i])<0) return false; }
  return true;
}
/* Relevancia: lo más específico primero (SAP o legajo exacto), después el
   nombre que arranca con lo buscado, y al final el resto de coincidencias. */
function relev(x,toks){
  var r=0, nm=up(x.prest);
  toks.forEach(function(t){
    if(up(x.sap)===t || up(x.legajo)===t) r-=100;
    else if(up(x.inleg).indexOf(t)>=0 && t.length>=4) r-=60;
    else if(nm.indexOf(t)===0) r-=40;
    else if(nm.indexOf(" "+t)>=0) r-=20;
    else if(nm.indexOf(t)>=0) r-=10;
  });
  return r;
}
/* Un solo lugar decide si un prestador pasa. campoExcluido sirve para los
   contadores en vivo: cuenta como si ese filtro no estuviera puesto. */
function pasa(x,campoExcluido,toks){
  var est=segActivo();
  if(campoExcluido!=="estado" && est && x.m.gen!==est) return false;
  if(campoExcluido!=="ugl"    && F.ugl && up(x.ugl)!==up(F.ugl)) return false;
  if(campoExcluido!=="grupo"  && F.grupo && x.grupos.indexOf(F.grupo)<0) return false;
  if(campoExcluido!=="capita" && F.capita==="si" && !x.cap) return false;
  if(campoExcluido!=="capita" && F.capita==="no" && x.cap) return false;
  if(toks.length && !matchea(x,toks)) return false;
  return true;
}
function aplicarFiltros(){
  var toks=tokens(F.qResto!=null?F.qResto:F.q);
  VIS=IDX.filter(function(x){ return pasa(x,null,toks); });
  if(toks.length){
    // dentro de cada estado, primero lo más relevante (el orden por estado se mantiene)
    var ord={ok:0,proc:1,rej:2};
    VIS.forEach(function(x){ x._rel=relev(x,toks); });
    VIS.sort(function(a,b){
      if(ord[a.m.gen]!==ord[b.m.gen]) return ord[a.m.gen]-ord[b.m.gen];
      if(a._rel!==b._rel) return a._rel-b._rel;
      return a.prest.localeCompare(b.prest,"es");
    });
  }
}
function cuenta(pred){ var n=0; IDX.forEach(function(x){ if(pred(x)) n++; }); return n; }
/* Contadores vivos: respetan todo lo demás menos el filtro que se está contando. */
function cuentaSalvo(campo, valor){
  var toks=tokens(F.qResto!=null?F.qResto:F.q);
  return IDX.filter(function(x){
    if(!pasa(x,campo,toks)) return false;
    if(campo==="estado") return x.m.gen===valor;
    if(campo==="ugl")    return up(x.ugl)===up(valor);
    if(campo==="grupo")  return x.grupos.indexOf(valor)>=0;
    if(campo==="capita") return valor==="si"?!!x.cap:!x.cap;
    return true;
  }).length;
}

/* ── RENDER ── */
function renderTodo(){ aplicarFiltros(); renderStats(); renderMapa(); renderChips(); renderLista(); renderFab(); }

/* ══════════════════════════════════════════════════════════════════════
   BARRA DE RESULTADOS — la estadística de arriba. Se recalcula SIEMPRE
   con los filtros y la búsqueda puestos: si buscás "córdoba", los tres
   números pasan a ser los de Córdoba. Antes contaba sobre el universo
   entero y quedaba congelada.
   ══════════════════════════════════════════════════════════════════════ */
function renderStats(){
  var est=segActivo();
  var nOk=cuentaSalvo("estado","ok"), nPr=cuentaSalvo("estado","proc"), nRj=cuentaSalvo("estado","rej");
  var tot=nOk+nPr+nRj;
  var EST=[{k:"ok",l:"Aprobados",n:nOk},{k:"proc",l:"En proceso",n:nPr},{k:"rej",l:"Rechazados",n:nRj}];
  var s='';
  EST.forEach(function(e){
    s+='<button class="rb '+e.k+(est===e.k?" on":"")+'" onclick="setEstado(\''+e.k+'\')">'
      +'<div class="rb-n">'+nfmt(e.n)+'</div><div class="rb-l">'+e.l+'</div></button>';
  });
  // El total también filtra: lo tocás y ves los tres estados juntos. Sirve
  // para mirar el universo completo, o el total de una UGL, o de un grupo.
  var acotado=!!(F.q||F.ugl||F.grupo||F.capita);
  s+='<button class="rb-tot'+(est?"":" on")+'" onclick="verTodos()" '
    +'title="Ver los tres estados juntos"><b>'+nfmt(tot)+'</b>'
    +'<span>'+(acotado?"filtrados":"total")+'</span></button>';
  document.getElementById("resBar").innerHTML=s;
  renderDetalle();
}
function filtrando(){ return !!(F.q||F.ugl||F.grupo||F.capita||segActivo()); }
/* Suelta el corte por estado sin tocar el resto de los filtros. */
function verTodos(){
  F.estado=""; SEG_MANUAL=buscando(); NL_SET.estado=0;
  PAGE=30; renderTodo();
}

/* Panel plegable con el desglose: etapas de Aprobados y grupos 375. */
function renderDetalle(){
  var box=document.getElementById("detBox"); if(!box) return;
  var toks=tokens(F.qResto!=null?F.qResto:F.q);
  var est=segActivo();
  /* El desglose sigue al chip de estado: en Aprobados muestra sus 3 etapas,
     en proceso las 4 sub-etapas del trámite, y sin estado los 7 hitos del
     camino completo. Antes mostraba siempre las de Aprobados y parecía trabado. */
  var conf;
  if(est==="ok")        conf={t:"Etapas de Aprobados", hitos:[5,6,7]};
  else if(est==="proc") conf={t:"Etapas de En proceso", hitos:[1,2,3,4]};
  else if(est==="rej")  conf={t:"Rechazados", hitos:[]};
  else                  conf={t:"Camino completo", hitos:[1,2,3,4,5,6,7]};
  var s='';
  if(conf.hitos.length){
    var vals=conf.hitos.map(function(n){
      var c=0;
      IDX.forEach(function(x){ if(x.m.gen!=="rej" && x.m.hito===n && pasa(x,null,toks)) c++; });
      return c;
    });
    var mx=Math.max.apply(null,[1].concat(vals));
    s+='<div class="blk-sub">'+conf.t+'</div><div class="etapas">';
    conf.hitos.forEach(function(n,i){
      var nm=HITOS[n-1]?HITOS[n-1].nm:("Etapa "+n);
      s+='<div class="et"><span class="nm">'+esc(nm)+'</span>'
        +'<span class="tr"><i style="width:'+Math.round(vals[i]/mx*100)+'%;background:'
        +(n>=5?"var(--ok)":"var(--proc)")+'"></i></span>'
        +'<span class="v">'+nfmt(vals[i])+'</span></div>';
    });
    s+='</div>';
  } else {
    var nr=cuentaSalvo("estado","rej");
    s+='<div class="blk-sub">'+conf.t+'</div>'
      +'<div class="disc" style="text-align:left;">'+nfmt(nr)+' casos fuera del circuito de firma. '
      +'Rechazo de UGTO o POPP, o devolución del expediente.</div>';
  }
  var GR=["Oftalmología","Imágenes","Especialidades"];
  var vals=GR.map(function(g){ return cuentaSalvo("grupo",g); });
  var mg=Math.max(1,Math.max.apply(null,vals));
  s+='<div class="blk-sub">Grupo 375</div>';
  GR.forEach(function(g,i){
    s+='<button class="gb'+(F.grupo===g?" on":"")+'" onclick="setGrupo(\''+g+'\')">'
      +'<span class="nm">'+esc(g)+'</span>'
      +'<span class="tr"><i style="width:'+Math.round(vals[i]/mg*100)+'%;background:'+window.__rubroColor(g)+'"></i></span>'
      +'<span class="v">'+nfmt(vals[i])+'</span></button>';
  });
  box.innerHTML=s;
}

/* Chips del header: estado, grupo y cápita en una fila deslizable. */
function renderChips(){
  var est=segActivo(), s='';
  [{k:"ok",l:"Aprobados",c:"ok"},{k:"proc",l:"En proceso",c:"proc"},{k:"rej",l:"Rechazados",c:"rej"}]
    .forEach(function(e){
      s+='<button class="chip'+(est===e.k?" on "+e.c:"")+'" onclick="setEstado(\''+e.k+'\')">'
        +e.l+' <b>'+nfmt(cuentaSalvo("estado",e.k))+'</b></button>';
    });
  s+='<span class="chip-sep"></span>';
  ["Oftalmología","Imágenes","Especialidades"].forEach(function(g){
    s+='<button class="chip'+(F.grupo===g?" on":"")+'" onclick="setGrupo(\''+g+'\')">'
      +g+' <b>'+nfmt(cuentaSalvo("grupo",g))+'</b></button>';
  });
  s+='<span class="chip-sep"></span>';
  s+='<button class="chip'+(F.capita==="si"?" on":"")+'" onclick="setCapita(\'si\')">'
    +'<i class="fa-solid fa-users" style="font-size:10px;"></i> Con cápita <b>'+nfmt(cuentaSalvo("capita","si"))+'</b></button>';
  if(F.ugl){
    s+='<button class="chip on" onclick="setUgl(\''+F.ugl.replace(/'/g,"\\'")+'\')">'
      +'<i class="fa-solid fa-location-dot" style="font-size:10px;"></i> '+esc(F.ugl)+' <b>&times;</b></button>';
  }
  if(filtrando()) s+='<button class="chip chip-clr" onclick="limpiarTodo()">'
    +'<i class="fa-solid fa-eraser" style="font-size:10px;"></i> Limpiar</button>';
  document.getElementById("chipBar").innerHTML=s;
}

/* Los paneles laterales se abren y cierran, y recuerdan cómo los dejaste. */
function togglePanel(id){
  var p=document.getElementById(id); if(!p) return;
  p.classList.toggle("cerrado");
  var b=p.querySelector(".panel-h");
  if(b) b.setAttribute("aria-expanded", p.classList.contains("cerrado")?"false":"true");
  try{ localStorage.setItem("t375_"+id, p.classList.contains("cerrado")?"1":"0"); }catch(e){}
}
function restaurarPaneles(){
  ["mapaPanel","detPanel"].forEach(function(id){
    var p=document.getElementById(id); if(!p) return;
    var v=null; try{ v=localStorage.getItem("t375_"+id); }catch(e){}
    // en celular el mapa arranca plegado: primero la lista, el mapa si lo pedís
    if(v===null && id==="mapaPanel") v=(window.innerWidth<980)?"1":"0";
    if(v===null) v="1";
    p.classList.toggle("cerrado", v==="1");
    var b=p.querySelector(".panel-h"); if(b) b.setAttribute("aria-expanded", v==="1"?"false":"true");
  });
}

function renderLista(){
  var box=document.getElementById("plist");
  document.getElementById("listN").textContent=nfmt(VIS.length)+" de "+nfmt(IDX.length);
  if(!VIS.length){
    box.innerHTML='<div class="empty">Ningún prestador entra con estos filtros.<br/>Probá quitando alguno o buscá por nombre, SAP o legajo.</div>';
    document.getElementById("listMore").style.display="none"; return;
  }
  var anim=!(F.q&&F.q.length);   // sin fade mientras se tipea: evita el parpadeo
  var agrupar=buscando() && !segActivo();   // mezcla de estados: separar en bloques
  var GL={ok:"Aprobados",proc:"En proceso",rej:"Rechazados"}, ultGen=null;
  var lote, restan;
  if(agrupar){
    // se reparte el cupo entre los tres bloques para que los tres se vean de
    // entrada, en vez de llenar la pantalla con el primero.
    var cupo=Math.max(6,Math.ceil(PAGE/3));
    lote=[];
    ["ok","proc","rej"].forEach(function(gk){
      lote=lote.concat(VIS.filter(function(y){return y.m.gen===gk;}).slice(0,cupo));
    });
    restan=VIS.length-lote.length;
  } else {
    lote=VIS.slice(0,PAGE);
    restan=VIS.length-lote.length;
  }
  box.innerHTML=lote.map(function(x,k){
    var cab="";
    if(agrupar && x.m.gen!==ultGen){
      ultGen=x.m.gen;
      var tot=VIS.filter(function(y){return y.m.gen===x.m.gen;}).length;
      var muestro=lote.filter(function(y){return y.m.gen===x.m.gen;}).length;
      cab='<div class="grp-h '+x.m.gen+'"><span class="dot"></span><span class="nm">'+GL[x.m.gen]+'</span>'
        +'<span class="n">'+(muestro<tot?(muestro+" de "+nfmt(tot)):nfmt(tot))+'</span></div>';
    }
    return cab+cardHTML(x,k,anim);
  }).join("");
  var mb0=document.getElementById("listMore");
  if(restan>0){ mb0.style.display=""; mb0.textContent="Ver "+Math.min(30,restan)+" más de "+nfmt(VIS.length); }
  else mb0.style.display="none";
}
function cardHTML(x,k,anim){
  return (function(){
    var tags=x.grupos.slice(0,3).map(function(g){ return '<span class="tag">'+esc(g)+'</span>'; }).join("");
    if(x.cap) tags+='<span class="tag cap"><i class="fa-solid fa-users" style="font-size:9px;"></i> Cápita</span>';
    if(x.ees>1) tags+='<span class="tag">'+x.ees+' EE</span>';
    return '<button class="pcard" style="'+(anim?('animation-delay:'+Math.min(k*18,340)+'ms'):'animation:none')+'" onclick="abrirDet('+x.i+')">'
      +'<div class="pc-top"><span class="pc-nm">'+esc(x.prest||"—")+'</span>'
        +'<span class="st '+x.m.gen+'"><i></i>'+esc(x.m.etapaNm)+'</span></div>'
      +'<div class="pc-meta">'
        +'<span><span class="k">SAP</span> <b class="mono">'+esc(x.sap)+'</b></span>'
        +(x.ugl?'<span><span class="k">UGL</span> '+esc(x.ugl)+'</span>':"")

/* Proyección equirectangular con el ancho corregido por la latitud media:
   sin esta corrección el país sale gordo y no se reconoce. */
function proyector(lon0,lon1,lat0,lat1,W,H,pad){
  pad=pad||0;
  var k=Math.cos((lat0+lat1)/2*Math.PI/180);
  var dx=(lon1-lon0)*k, dy=(lat0-lat1);
  var s=Math.min((W-pad*2)/dx,(H-pad*2)/dy);
  var ox=(W-dx*s)/2, oy=(H-dy*s)/2;
  return function(lon,lat){
    return [ ox+(lon-lon0)*k*s, oy+(lat0-lat)*s ];
  };
}
/* Aparta las burbujas que se pisan, sin perder de vista dónde va cada una:
   queda un hilo del punto real al círculo corrido. */
function desapilar(items,iter,resorte){
  iter=iter||110; resorte=(resorte==null?0.06:resorte);
  items.forEach(function(it){ it.x=it.ax; it.y=it.ay; it.rx=it.rx||it.r; it.ry=it.ry||it.r; });
  for(var k=0;k<iter;k++){
    for(var i=0;i<items.length;i++){
      var a=items[i];
      for(var j=i+1;j<items.length;j++){
        var b=items[j];
        var dx=b.x-a.x, dy=b.y-a.y;
        var mx=a.rx+b.rx+2, my=a.ry+b.ry+2;
        // colisión medida en elipse: el texto ensancha, no alarga
        var nx=dx/mx, ny=dy/my, d=Math.sqrt(nx*nx+ny*ny);
        if(d<1 && d>0){
          var f=(1-d)/d*0.5;
          a.x-=nx*mx*f; a.y-=ny*my*f; b.x+=nx*mx*f; b.y+=ny*my*f;
        } else if(d===0){ a.x-=1; b.x+=1; }
      }
      a.x+=(a.ax-a.x)*resorte; a.y+=(a.ay-a.y)*resorte;
    }
  }
  return items;
}
/* Como proyector, pero encajando el dibujo en una caja concreta: así el mapa
   ocupa el centro y quedan los márgenes libres para los nombres. */
function proyectorCaja(lon0,lon1,lat0,lat1,x0,x1,y0,y1){
  var k=Math.cos((lat0+lat1)/2*Math.PI/180);
  var dx=(lon1-lon0)*k, dy=(lat0-lat1);
  var s=Math.min((x1-x0)/dx,(y1-y0)/dy);
  var ox=x0+((x1-x0)-dx*s)/2, oy=y0+((y1-y0)-dy*s)/2;
  return function(lon,lat){ return [ ox+(lon-lon0)*k*s, oy+(lat0-lat)*s ]; };
}
function poly(pts,pr){
  return "M"+pts.map(function(p){ var q=pr(p[0],p[1]); return q[0].toFixed(1)+","+q[1].toFixed(1); }).join("L")+"Z";
}

/* Cuántos casos tiene cada UGL con los filtros vigentes (menos el de UGL). */
function conteoUgl(){
  var m={};
  Object.keys(UGL_GEO).forEach(function(u){ m[u]={n:0,ok:0}; });
  var toks=tokens(F.qResto!=null?F.qResto:F.q);
  IDX.forEach(function(x){
    var u=up(x.ugl); if(!m[u]) return;
    if(!pasa(x,"ugl",toks)) return;
    m[u].n++; if(x.m.gen==="ok") m[u].ok++;
  });
  return m;
}

/* Las tres UGL del sur profundo quedan fuera del recorte del mapa y se
   listan como chips debajo: el circuito 375 casi no las toca y estirar el
   dibujo hasta Ushuaia gastaba media pantalla en vacío. */
var UGL_SUR=["CHUBUT","SANTA CRUZ","TIERRA DEL FUEGO"];
/* Recorte del dibujo: del norte hasta el río Negro. */
var VENT_PAIS={lon0:-73.6,lon1:-53.4,lat0:-21.6,lat1:-41.8};

/* Corta el contorno a la ventana visible: lo que baja de lat1 se pega al borde. */
function recortar(pts,lat1){
  return pts.map(function(p){ return [p[0], Math.max(p[1],lat1)]; });
}

/* Reparte etiquetas en una columna vertical sin que se pisen: se ordenan
   por altura, se separan con un mínimo, y si se pasan del alto se comprimen
   hacia arriba. Es el truco de los mapas con líneas guía al margen. */
function columnaEtiquetas(items,alto,gap,margen){
  gap=gap||9.5; margen=margen||4;
  items.sort(function(a,b){ return a.y-b.y; });
  var y=margen;
  items.forEach(function(it){ it.ly=Math.max(it.y,y); y=it.ly+gap; });
  var sobra=y-gap-(alto-margen);
  if(sobra>0){
    // no entran: se empujan hacia arriba conservando el orden
    var yy=alto-margen;
    for(var i=items.length-1;i>=0;i--){ items[i].ly=Math.min(items[i].ly,yy); yy=items[i].ly-gap; }
  }
  return items;
}

function renderMapa(){

  function burbuja(o,extra){
    var u=o.u, c=o.c, r=o.r;

    // etiqueta al margen, unida con una línea guía en codo
    if(o.ly!=null){

    if(on) s+='<circle class="halo" cx="'+o.x.toFixed(1)+'" cy="'+o.y.toFixed(1)+'" r="'+(r+4.5).toFixed(1)+'"/>';

    if(c.n && r>=7) s+='<text class="bn" x="'+o.x.toFixed(1)+'" y="'+(o.y+3.2).toFixed(1)+'">'+c.n+'</text>';
    if(extra&&extra.marca) s+='<text class="bmarca" x="'+o.x.toFixed(1)+'" y="'+(o.y+r+8.5).toFixed(1)+'">'+esc(extra.marca)+'</text>';
    s+='</g>';
    return s;
  }
  function armar(lista,pr,rMax,resorte){
    var it=lista.map(function(u){
      var c=cnt[u]||{n:0,ok:0}, g=UGL_GEO[u], q=pr(g[0],g[1]);
      var r=(c.n?Math.min(4+Math.sqrt(c.n/max)*rMax, rMax+3):3);
      return {u:u,c:c,ax:q[0],ay:q[1],r:r,rx:r,ry:r};
    });
    return desapilar(it,150,resorte);
  }
  /* Manda cada burbuja con casos a la columna de etiquetas del lado más cercano. */
  function ponerEtiquetas(items,W,H,izqX,derX,corte){
    var izq=[], der=[];
    items.forEach(function(o){
      if(!o.c.n) return;
      if(o.x<corte){ o.lado="izq"; o.colX=izqX; izq.push(o); }
      else{ o.lado="der"; o.colX=derX; der.push(o); }

  /* ── mapa nacional: el dibujo va al centro y los nombres a los márgenes ── */
  var W=360,H=340, MARG=74;
  var V=VENT_PAIS;
  var pr=proyectorCaja(V.lon0,V.lon1,V.lat0,V.lat1,MARG,W-MARG,6,H-6);
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="mapa" role="img" aria-label="Mapa de UGL">';
  s+='<path class="pais" d="'+poly(recortar(AR_BORDE,V.lat1),pr)+'"/>';

  var paisList=Object.keys(UGL_GEO).filter(function(u){
    return UGL_AMBA.indexOf(u)<0 && UGL_SUR.indexOf(u)<0;

  var items=armar(paisList,pr,8,0.06);
  /* el AMBA entra como UNA burbuja con el total: se abre si la tocás */
  var nA=0,okA=0; UGL_AMBA.forEach(function(u){ nA+=cnt[u].n; okA+=cnt[u].ok; });
  var pa=pr(-58.45,-34.62);

  var todos=items.concat([amba]);
  ponerEtiquetas(todos,W,H,MARG-8,W-MARG+8,(MARG+(W-MARG))/2);
  amba.ly=null;   // el AMBA lleva su rótulo pegado, no en la columna
  items.forEach(function(o){ s+=burbuja(o); });

                   on:(UGL_AMBA.indexOf(sel)>=0)||AMBA_ABIERTO});

  /* ── AMBA ampliado: mismo criterio de nombres al margen ── */

    var pr2=proyectorCaja(VENT_AMBA.lon0,VENT_AMBA.lon1,VENT_AMBA.lat0,VENT_AMBA.lat1,M2,W2-M2,14,H2-10);
    var rio=[[-58.66,-34.42],[-58.45,-34.53],[-58.30,-34.66],[-58.05,-34.82],[-57.88,-34.94],
             [-57.78,-35.06],[-57.72,-35.12],[-57.72,-34.30],[-58.66,-34.30]];

      +'<button onclick="toggleAmba()" aria-label="Cerrar AMBA"><i class="fa-solid fa-xmark"></i></button></div>'
      +'<svg viewBox="0 0 '+W2+' '+H2+'" class="mapa amba" role="img" aria-label="UGL del AMBA">'
      +'<path class="rio" d="'+poly(rio,pr2)+'"/>';

    ponerEtiquetas(itA,W2,H2,M2-8,W2-M2+8,W2/2);
    itA.forEach(function(o){ s2+=burbuja(o); });

  /* ── el sur, como chips ── */
  var s3='<div class="sur">';

    var c=cnt[u];

  var pie='';

    pie='<div class="mapa-sel"><span class="ms-nm">'+esc(sel)+'</span>'
      +'<span class="ms-n">'+nfmt(cnt[sel].n)+' casos · '+nfmt(cnt[sel].ok)+' aprobados</span>'
      +'<button class="ms-x" onclick="tocarUgl(\''+sel.replace(/'/g,"\\'")+'\')">Quitar</button></div>';
  } else {
    pie='<div class="mapa-hint">Tocá una UGL para filtrar la lista</div>';
  }
  box.innerHTML=s+s2+s3+pie;
}

/* Placeholder honesto: mientras no haya dato, se dice que no lo hay.
   Cuando exista, alcanza con que la fila del espejo traiga FACTURACION
   (o que se embeba un mapa SAP -> monto) y esto lo muestra solo. */
function facturacionHTML(x){
  var raw=String(G(x.r,"FACTURACION")||G(x.r,"FACTURACION ANUAL")||"").replace(/[^\d,.-]/g,"");
  var v=Number(raw.replace(/\./g,"").replace(",","."));
  if(raw && !isNaN(v) && v>0){
    return '<div class="cap-head"><div><div class="cap-n mono">$'+nfmt(Math.round(v))+'</div>'
      +'<div class="cap-u">facturación aproximada del prestador</div></div></div>';
  }
  return '<div class="disc soon"><i class="fa-solid fa-hourglass-half"></i> Sin dato de facturación todavía.'
    +'<br/><span>Cuando se cargue, este bloque ordena la prioridad: primero los que más facturan.</span></div>';
}

function capitaHTML(x){
  if(!x.cap) return '<div class="disc">Sin cápita de referencia cargada para este SAP + UGL.</div>';
  var c=x.cap, ult=c.meses[c.meses.length-1];
  var proms=c.promedioBloque[ult]||{};
  var rubros=Object.keys(proms);
  var h='<div class="cap-head"><div><div class="cap-n mono">'+__capNfmt(Object.keys(proms).reduce(function(a,k){return a+proms[k];},0))+'</div>'
    +'<div class="cap-u">personas capitadas · promedio por bloque · '+esc(__capPeriodoLbl(ult))+'</div></div></div>';
  h+='<div class="cap-blk">'+rubros.map(function(rb){
    var prev=null;
    if(c.meses.length>1){ var pm=c.promedioBloque[c.meses[c.meses.length-2]]; if(pm&&pm[rb]!=null) prev=pm[rb]; }
    var flecha="";
    if(prev!=null && prev!==proms[rb]) flecha=' <span style="font-size:11px;color:'+(proms[rb]>prev?"var(--ok)":"var(--rej)")+'">'+(proms[rb]>prev?"▲":"▼")+'</span>';
    return '<div class="cap-pill" style="border-left:3px solid '+window.__rubroColor(rb)+';border-radius:0 var(--r) var(--r) 0;">'
      +'<div class="l">'+esc(rb)+'</div><div class="v mono">'+__capNfmt(proms[rb])+flecha+'</div></div>';
  }).join("")+'</div>';
  /* tabla bloque × módulo × mes */
  var modInfo={};
  c.meses.forEach(function(mm){ (c.porMes[mm]||[]).forEach(function(o){
    if(!modInfo[o.mod]) modInfo[o.mod]={desc:o.desc||"",rub:(window.__rubroDeModulo(o.mod)||"Otros"),v:{}};
    modInfo[o.mod].v[mm]=o.cap;
  }); });
  var mods=Object.keys(modInfo).sort(function(a,b){ return (modInfo[a].rub+a).localeCompare(modInfo[b].rub+b); });
  h+='<table class="cap-tbl"><thead><tr><th>Módulo</th>'+c.meses.map(function(mm){return '<th style="text-align:right;">'+esc(__capPeriodoLbl(mm))+'</th>';}).join("")+'</tr></thead><tbody>';
  mods.forEach(function(md){
    h+='<tr><td><b class="mono">'+esc(md)+'</b> <span style="color:var(--tx3);font-size:11px;">'+esc((modInfo[md].desc||"").slice(0,34))+'</span></td>'
      +c.meses.map(function(mm){ return '<td class="mono" style="text-align:right;">'+(modInfo[md].v[mm]!=null?__capNfmt(modInfo[md].v[mm]):"—")+'</td>'; }).join("")+'</tr>';
  });
  rubros.forEach(function(rb){
    h+='<tr class="pr"><td>Promedio '+esc(rb)+'</td>'
      +c.meses.map(function(mm){ var p=(c.promedioBloque[mm]||{})[rb]; return '<td class="mono" style="text-align:right;">'+(p!=null?__capNfmt(p):"—")+'</td>'; }).join("")+'</tr>';
  });
  h+='</tbody></table><div class="cap-note">La cápita es un número referencial de personas, no un monto. No se suma entre módulos: se promedia por bloque.</div>';
  return h;
}

/* sinEstado=true para el informe: ahí se muestran los tres estados, así que
   poner "Aprobados" en el encabezado sería mentir sobre el alcance. */
function filtroLbl(sinEstado){
  var p=[];
  if(F.estado && !sinEstado) p.push({ok:"Aprobados",proc:"En proceso",rej:"Rechazados"}[F.estado]);
  if(F.grupo) p.push(F.grupo);
  if(F.ugl) p.push("UGL "+F.ugl);
  if(F.capita==="si") p.push("con cápita");
  if(F.capita==="no") p.push("sin cápita");
  if(F.q) p.push('"'+F.q+'"');
  return p.length?p.join(" · "):"Universo completo";
}

/* ══════════════════════════════════════════════════════════════════════
   INFORME GENERAL — resumen estadístico de lo que se está mirando.
   Si no hay filtros sale el universo completo; si hay, sale acotado a eso
   (una UGL, un grupo, lo que devolvió la búsqueda). Se imprime a PDF.
   ══════════════════════════════════════════════════════════════════════ */
function exportInforme(){
  if(!IDX.length){ alert("Todavía no cargaron los datos del circuito."); return; }
  var toks=tokens(F.qResto!=null?F.qResto:F.q);
  /* universo del informe: todo lo que pasa los filtros MENOS el corte por
     estado, para poder mostrar la composición de los tres */
  var uni=IDX.filter(function(x){ return pasa(x,"estado",toks); });
  if(!uni.length){ alert("No hay casos para informar con los filtros actuales."); return; }
  var n=uni.length;
  function pct(v){ return n?Math.round(v/n*100):0; }

  var porEst={ok:0,proc:0,rej:0};
  var etapas={}, grupos={}, ugls={}, conCap=0, capBloques={};
  uni.forEach(function(x){
    porEst[x.m.gen]++;
    if(x.m.gen!=="rej") etapas[x.m.hito]=(etapas[x.m.hito]||0)+1;
    x.grupos.forEach(function(g){ grupos[g]=(grupos[g]||0)+1; });
    if(x.ugl){ if(!ugls[x.ugl]) ugls[x.ugl]={n:0,ok:0}; ugls[x.ugl].n++; if(x.m.gen==="ok") ugls[x.ugl].ok++; }
    if(x.cap){
      conCap++;
      var m=x.cap.meses[x.cap.meses.length-1], pr=x.cap.promedioBloque[m]||{};
      Object.keys(pr).forEach(function(rb){
        if(!capBloques[rb]) capBloques[rb]={suma:0,n:0};
        capBloques[rb].suma+=pr[rb]; capBloques[rb].n++;
      });
    }
  });

  function barras(pares,total,color){
    var mx=Math.max.apply(null,[1].concat(pares.map(function(p){return p[1];})));
    return '<div class="bl">'+pares.map(function(p){
      return '<div class="br"><span class="n">'+esc(p[0])+'</span>'
        +'<span class="t"><i style="width:'+Math.round(p[1]/mx*100)+'%;background:'+(p[2]||color)+'"></i></span>'
        +'<span class="v">'+nfmt(p[1])+'</span>'
        +'<span class="p">'+(total?Math.round(p[1]/total*100):0)+'%</span></div>';
    }).join("")+'</div>';
  }

  /* composición por estado */
  var comp=barras([["Aprobados",porEst.ok,"#16A34A"],["En proceso",porEst.proc,"#D97706"],
                   ["Rechazados",porEst.rej,"#DC2626"]],n);
  /* camino a la firma */
  var camino=barras(HITOS.map(function(hi){
    return [hi.nm,(etapas[hi.n]||0),(hi.n>=5?"#16A34A":"#D97706")];
  }),n);
  /* grupos 375 */

/* ══════════════════════════════════════════════════════════════════════
   INTERPRETACIÓN DEL TEXTO — corre en cada tecla, no solo por voz.
   Separa lo que es INTENCIÓN (estado, UGL, grupo, cápita) de lo que es
   TEXTO LIBRE (nombre, SAP, legajo). Sin esto, escribir "aprobados moron"
   no encontraba nada: exigía la palabra "aprobados" dentro de los datos.
   Lo que el parser puso lo recuerda en NL_SET, así que si borrás esa
   palabra del buscador el filtro se suelta solo; y lo que elegiste a mano
   (un chip, una UGL del mapa) no se pisa.
   ══════════════════════════════════════════════════════════════════════ */
var NL_SET={};
var PALABRAS_ESTADO=[
  {re:/\b(APROBAD\w*|FIRMAD\w*|ADHERID\w*)\b/, v:"ok",   lbl:"Aprobados"},
  {re:/\b(EN\s+PROCESO|EN\s+TRAMITE|TRAMITANDO|PENDIENTE\w*)\b/, v:"proc", lbl:"En proceso"},
  {re:/\b(RECHAZAD\w*|DEVUELT\w*|CAID\w*)\b/, v:"rej",  lbl:"Rechazados"}
];
var PALABRAS_GRUPO=[
  {re:/\b(OFTALMOLOG\w*|OFTALMO|OJOS|VISTA)\b/, v:"Oftalmología"},
  {re:/\b(IMAGEN\w*|RADIOLOG\w*|DIAGNOSTICO\s+POR\s+IMAGEN\w*)\b/, v:"Imágenes"},
  {re:/\b(ESPECIALIDAD\w*|ESPECIALISTA\w*|CLINIC\w*)\b/, v:"Especialidades"}
];
function interpretar(txt){
  var t=up(txt||""), ap=[], puesto={}, res=" "+t+" ";
  function sacar(re){ res=res.replace(re," "); }

  // ── UGL: se prueba el nombre más largo primero (SAN JUSTO antes que SAN JUAN)
  var uglNames=Object.keys(UGL_ORDER).sort(function(a,b){ return b.length-a.length; });
  for(var i=0;i<uglNames.length;i++){
    var rx=new RegExp("\\b"+uglNames[i].replace(/ /g,"\\s+")+"\\b");
    if(rx.test(res)){ F.ugl=uglNames[i]; puesto.ugl=1; ap.push({f:"ugl",v:uglNames[i]}); sacar(rx); break; }
  }
  // alias frecuentes que no coinciden con el nombre de la UGL
  if(!puesto.ugl){
    var ALIAS={"CABA":"CAPITAL FEDERAL","CIUDAD DE BUENOS AIRES":"CAPITAL FEDERAL","CAPITAL":"CAPITAL FEDERAL",
               "MATANZA":"SAN JUSTO","LA MATANZA":"SAN JUSTO","MARDEL":"MAR DEL PLATA","BAHIA":"BAHIA BLANCA",
               "SGO DEL ESTERO":"SANTIAGO DEL ESTERO","TDF":"TIERRA DEL FUEGO"};
    for(var a in ALIAS){
      var ra=new RegExp("\\b"+a.replace(/ /g,"\\s+")+"\\b");
      if(ra.test(res)){ F.ugl=ALIAS[a]; puesto.ugl=1; ap.push({f:"ugl",v:ALIAS[a]}); sacar(ra); break; }
    }
  }
  // ── estado
  for(var e=0;e<PALABRAS_ESTADO.length;e++){
    if(PALABRAS_ESTADO[e].re.test(res)){
      F.estado=PALABRAS_ESTADO[e].v; SEG_MANUAL=true; puesto.estado=1;
      ap.push({f:"estado",v:PALABRAS_ESTADO[e].lbl}); sacar(PALABRAS_ESTADO[e].re); break;
    }
  }
  // ── grupo 375
  for(var g=0;g<PALABRAS_GRUPO.length;g++){
    if(PALABRAS_GRUPO[g].re.test(res)){
      F.grupo=PALABRAS_GRUPO[g].v; puesto.grupo=1;
      ap.push({f:"grupo",v:PALABRAS_GRUPO[g].v}); sacar(PALABRAS_GRUPO[g].re); break;
    }
  }
  // ── cápita
  if(/\bSIN\s+CAPITA\b/.test(res)){ F.capita="no"; puesto.capita=1; ap.push({f:"capita",v:"Sin cápita"}); sacar(/\bSIN\s+CAPITA\b/); }
  else if(/\b(CON\s+CAPITA|CAPITAD\w*|CAPITA)\b/.test(res)){ F.capita="si"; puesto.capita=1; ap.push({f:"capita",v:"Con cápita"}); sacar(/\b(CON\s+CAPITA|CAPITAD\w*|CAPITA)\b/); }

  // ── lo que el parser había puesto antes y ya no está en el texto, se suelta
  ["ugl","estado","grupo","capita"].forEach(function(k){
    if(NL_SET[k] && !puesto[k]){ F[k]=""; if(k==="estado") SEG_MANUAL=false; }
  });
  NL_SET=puesto;

  // ── residual: palabras de relleno fuera, el resto es texto libre
  ["DE","DEL","LOS","LAS","LA","EL","QUE","CON","SIN","Y","EN","UGL","PRESTADOR","PRESTADORES","TODOS","TODAS"]
    .forEach(function(w){ res=res.replace(new RegExp("\\s"+w+"\\s","g")," "); });
  F.qResto=res.replace(/\s+/g," ").trim();
  window.__NL=ap; renderNL();
}
/* se mantiene el nombre viejo por si algo lo llama */
function parserLocal(txt){ interpretar(txt); PAGE=30; renderTodo(); }
function renderNL(){
  var box=document.getElementById("nlChips"), ap=window.__NL||[];
  if(!ap.length){ box.style.display="none"; box.innerHTML=""; return; }
  box.innerHTML='<span class="nl-lbl">Interpreté</span>'+ap.map(function(a){
    return '<span class="nl-chip">'+esc(a.v)+' <b onclick="quitarNL(\''+a.f+'\')" title="Quitar">&times;</b></span>';
  }).join("");
  box.style.display="flex";
}
function quitarNL(f){
  F[f]=""; if(f==="estado") SEG_MANUAL=false; NL_SET[f]=0;
  window.__NL=(window.__NL||[]).filter(function(a){return a.f!==f;});
  renderNL(); PAGE=30; renderTodo();
}

function __interpretarConIA(texto){
  var KEY=__getApiKey(); if(!KEY) return;
  var ugls=Object.keys(UGL_ORDER).join(" | ");
  var glosario="";

    +"- ok = APROBADOS: pasaron UTM. Incluye adenda con VB, adenda en UGL, adenda firmada (INLEG cargado), asignación de cápita y cierre.\n"
    +"- proc = EN PROCESO: todo lo previo a la firma (análisis POPP, documentación, en UGL, derivar a UTM, en UTM).\n"
    +"- rej = RECHAZADOS: rechazado UGTO, rechazado POPP, devolver EE.\n\n"
    +"GLOSARIO DE ESTADOS REALES DEL CIRCUITO:\n"+glosario+"\n\n"

    +"- estado: ok | proc | rej | vacío.\n"
    +"- ugl: EXACTAMENTE una de estas o vacío: "+ugls+".\n"
    +"- grupo: Oftalmología | Imágenes | Especialidades | vacío.\n"
    +"- capita: si | no | vacío.\n"
    +"- texto: nombre de prestador, SAP o legajo si lo menciona; si no, vacío.";
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":KEY,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:300,system:sys,
      messages:[{role:"user",content:texto}]})
  }).then(function(r){return r.json();}).then(function(d){
    try{
      var txt=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
      var js=JSON.parse(txt.replace(/```json|```/g,"").trim());
      var ap=[];
      if(js.estado){ F.estado=js.estado; SEG_MANUAL=true; ap.push({f:"estado",v:{ok:"Aprobados",proc:"En proceso",rej:"Rechazados"}[js.estado]||js.estado}); }
      if(js.ugl){ F.ugl=js.ugl; ap.push({f:"ugl",v:js.ugl}); }
      if(js.grupo){ F.grupo=js.grupo; ap.push({f:"grupo",v:js.grupo}); }
      if(js.capita){ F.capita=js.capita; ap.push({f:"capita",v:js.capita==="si"?"Con cápita":"Sin cápita"}); }
      F.q=js.texto||"";
      window.__NL=ap; renderNL(); PAGE=30; renderTodo();
    }catch(e){}
  }).catch(function(){});
}

window.__hashDe=function(txt){
  var s=String(txt);
  if(window.crypto && window.crypto.subtle){
    return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))
      .then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf),function(b){
          return ("0"+b.toString(16)).slice(-2);
        }).join("");
      });
  }
  return Promise.resolve("");  /* sin crypto: no se puede validar */
};

/* Dibuja el camino de 7 hitos como marca gráfica del ingreso. */
function pintarPath(){
  var box=document.getElementById("gPath"); if(!box) return;
  var h="";
  for(var i=0;i<7;i++){
    var on=(i<6), last=(i===6);
    if(i) h+='<span class="g-link'+(i<6?" on":"")+'" style="animation-delay:'+(140+i*95)+'ms"></span>';
    h+='<span class="g-node'+(last?" last":(on?" on":""))+'" style="animation-delay:'+(100+i*95)+'ms"></span>';
  }
  box.innerHTML=h;
}

function entrar(){
  var u=(document.getElementById("gUser").value||"").trim().toLowerCase();
  var p=(document.getElementById("gPass").value||"");
  var err=document.getElementById("gErr");
  if(!u||!p){ mostrarErr("Completá usuario y clave."); return; }
  window.__hashDe(u+"|"+p).then(function(hx){
    if(!hx){ mostrarErr("Este navegador no permite validar el acceso. Abrilo desde el enlace publicado."); return; }
    var ok=null;
    AUTH_USERS.forEach(function(a){ if(a.hash===hx) ok=a; });
    if(!ok){ mostrarErr("Usuario o clave incorrectos."); return; }
    try{ sessionStorage.setItem("t375_sesion", hx); }catch(e){}
    abrirApp(ok.alias);
  });
}
function mostrarErr(msg){
  var err=document.getElementById("gErr");
  err.textContent=msg; err.classList.add("show");
  var c=document.querySelector(".g-card");
  c.classList.remove("g-shake"); void c.offsetWidth; c.classList.add("g-shake");
}
function abrirApp(alias){
  window.__usuario=alias||"";
  document.getElementById("gate").classList.add("out");
  document.body.style.overflow="";
  setTimeout(function(){ var g=document.getElementById("gate"); if(g) g.style.display="none"; },520);
  if(!window.__arrancada){ window.__arrancada=true; arrancar(); }
}

/* Sesión vigente: si ya entró en esta pestaña, no vuelve a pedir. */
(function(){
  pintarPath();
  var s=null; try{ s=sessionStorage.getItem("t375_sesion"); }catch(e){}
  var hit=null; if(s) AUTH_USERS.forEach(function(a){ if(a.hash===s) hit=a; });
  if(hit){ abrirApp(hit.alias); }
  else{
    document.body.style.overflow="hidden";
    setTimeout(function(){ var f=document.getElementById("gUser"); if(f) f.focus(); },600);
    ["gUser","gPass"].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter") entrar(); });
    });
  }
})();
</script>
